[package]
name = "clay-mic"
version = "1.1.0"
edition = "2021"
description = "Bluetooth remote voice input for Windows: BLE ATVV voice, local whisper.cpp transcription, and text injection."
license = "MIT"

[lib]
name = "clay_mic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "clay-mic"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart", "gzip", "brotli", "deflate"], default-features = false }
async-trait = "0.1"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
thiserror = "2"
futures = "0.3"
enigo = { version = "0.2", optional = true }
libloading = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
# Windows BLE via WinRT
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_WinRT",
    "Foundation",
    "Devices_Bluetooth",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Enumeration",
    "Storage_Streams",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_DataExchange",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol", "ble", "inject"]
custom-protocol = ["tauri/custom-protocol"]
ble = []
inject = ["enigo"]

[workspace]
members = ["keyslots", "tap-dll"]
