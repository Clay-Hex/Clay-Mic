[package]
name = "clay-mic-keyslots"
version = "1.0.0"
edition = "2021"
description = "Folds Windows' keyboard/mouse device numbering back into the single-digit range the Interception driver can parse."
license = "MIT"

[[bin]]
name = "clay-mic-keyslots"
path = "src/main.rs"

# Deliberately dependency-free: this runs as a SYSTEM service, so its supply
# chain stays as small as the raw FFI it actually needs.
[dependencies]
