<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8edf3"/>
    </linearGradient>
  </defs>

  <!-- light plate (Windows 11 style squircle) -->
  <rect width="512" height="512" rx="118" fill="url(#plate)"/>

  <!-- contact shadow -->
  <ellipse cx="240" cy="456" rx="104" ry="22" fill="#0f172a" opacity=".12"/>

  <!-- remote body (concept 02, x8 of the 64 grid) -->
  <rect x="176" y="40" width="136" height="400" rx="68" fill="#1e293b"/>
  <rect x="196" y="72" width="24" height="336" rx="12" fill="#334155"/>

  <!-- voice key -->
  <circle cx="244" cy="120" r="40" fill="#22d3ee"/>

  <!-- d-pad -->
  <circle cx="244" cy="264" r="60" fill="#334155"/>
  <circle cx="244" cy="264" r="21" fill="#475569"/>

  <!-- sound waves (deepened cyan for light-plate contrast) -->
  <path d="M344 92a60 60 0 0 1 0 56" fill="none" stroke="#06b6d4" stroke-width="24" stroke-linecap="round"/>
  <path d="M380 64a108 108 0 0 1 0 112" fill="none" stroke="#06b6d4" stroke-width="24" stroke-linecap="round" opacity=".5"/>
</svg>
