name: 功能建议
description: 提出一个功能建议或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议。请描述你的使用场景和期望行为，帮助我们理解这个功能的价值。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景 / 痛点
      description: 你在什么场景下需要这个功能？目前遇到了什么不便？
      placeholder: 例如：我想在没有键盘的环境下用语音快速输入命令行指令...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你希望 clay-mic 如何工作？
      placeholder: 例如：在悬浮窗中增加一个「命令模式」选项，转写完成后直接发送到终端...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你是否考虑过其他实现方式？或者用其他工具实现了类似功能？
      placeholder: 例如：目前只能手动复制粘贴到终端...
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 其他上下文
      description: 补充任何有助于理解这个需求的信息（截图、参考项目、相关链接等）
      placeholder: 例如：参考某某项目的做法...
    validations:
      required: false
