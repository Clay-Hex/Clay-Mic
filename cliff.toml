# git-cliff 配置：从 Conventional Commits 生成 CHANGELOG.md（Keep a Changelog 风格）。
# 与 scripts/sync-version.mjs 协同：版本号同步后由 git-cliff 生成本版小节。
#
#   npm run changelog        生成/更新 CHANGELOG.md
#   npm run changelog -- -o -  仅输出到 stdout（不落盘）
[changelog]
header = """
# 更新日志

本项目的重要变更记录于此。

格式参考 [Keep a Changelog](https://keepachangelog.com/zh-CN/1.1.0/)，
版本号遵循 [语义化版本](https://semver.org/lang/zh-CN/)。

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n"""
footer = """
<!-- 由 git-cliff 生成；请勿手工编辑本文件。 -->
"""
trim = true
render_always = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = false
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "新增" },
  { message = "^fix", group = "修复" },
  { message = "^refactor", group = "重构" },
  { message = "^perf", group = "性能" },
  { message = "^style", group = "样式" },
  { message = "^docs", group = "文档" },
  { message = "^chore|^ci|^build", group = "杂项" },
  { message = "^test", group = "测试" },
  { message = "^revert", group = "回退" },
  { message = ".*", group = "其他", default_scope = "other" },
]
tag_pattern = "v[0-9]*"
